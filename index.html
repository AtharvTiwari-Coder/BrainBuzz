<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BrainBuzz</title>
    <link rel="icon" type="image/png" href="BrainBuzzLogo.png" />
  </head>
  <style>
    :root {
      --bg: rgb(25, 25, 25);
      --text: rgb(237, 237, 237);
      --glow: rgba(250, 250, 250, 0.08);
      --btn-bg: rgba(34, 34, 34, 0.9);
      --btn-text: var(--text);
      --transition: 220ms cubic-bezier(0.2, 0.9, 0.2, 1);
      --fade-duration: 2000ms;
    }

    /* fonts */
    @font-face {
      font-family: "StencilCustom";
      src: url("Main/Fonts/StencilFont.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "RoundedCustom";
      src: url("Main/Fonts/ArialRoundedMTBoldRegularFont.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition:
        background-color var(--fade-duration) ease,
        color var(--fade-duration) ease;
    }

    /* layout */
    .container {
      width: 100%;
      max-width: 900px;
      padding: 48px 24px;
      text-align: center;
    }
    .hero {
      padding: 48px;
      border-radius: 14px;
      box-shadow: 0 8px 30px var(--glow);
      backdrop-filter: blur(6px);
      transition:
        background-color var(--fade-duration) ease,
        box-shadow var(--fade-duration) ease,
        color var(--fade-duration) ease,
        transform 160ms ease;
    }

    /* title & tagline */
    .title {
      margin: 0;
      font-size: 48px;
      letter-spacing: 2px;
      color: var(--text);
      font-family: "StencilCustom", system-ui, sans-serif;
      text-transform: uppercase;
      transition: color var(--fade-duration) ease;
    }
    .tagline {
      margin: 18px 0 28px;
      font-size: 15px;
      color: var(--text);
      opacity: 0.95;
      max-width: 820px;
      margin-left: auto;
      margin-right: auto;
      transition:
        color var(--fade-duration) ease,
        opacity var(--fade-duration) ease;
    }

    /* start button */
    .start-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      background: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      font-family: "RoundedCustom", "Segoe UI", Arial, sans-serif;
      box-shadow: 0 6px 20px var(--glow);
      transform: scale(1);
      transition:
        transform 180ms cubic-bezier(0.2, 0.9, 0.2, 1),
        box-shadow var(--fade-duration) ease,
        background-color var(--fade-duration) ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    /* hover and pressed behavior (updated scales) */
    .start-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 36px rgba(250, 250, 250, 0.12);
    }
    .start-btn:active {
      transform: scale(1.25);
    }

    /* pressed class used by JS to ensure consistent behavior */
    .start-btn.pressed {
      transform: scale(1.25);
      transition: transform 120ms ease-in-out;
    }

    /* small arrow styling */
    .btn-arrow {
      font-size: 20px;
      opacity: 0.95;
    }

    /* theme slider bottom-right */
    .theme-slider {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 170px;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    /* slider track */
    .theme-slider input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      width: 100%;
      height: 36px;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.06),
        rgba(255, 255, 255, 0.02)
      );
      border-radius: 20px;
      padding: 6px;
      outline: none;
      box-shadow: 0 6px 20px var(--glow);
      transition:
        box-shadow var(--fade-duration) ease,
        background-color var(--fade-duration) ease;
    }

    /* standard + vendor prefixes for compatibility and smooth thumb movement */
    /* standard property included for VSCode compatibility */
    .theme-slider input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fff, #ddd);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition:
        transform 180ms ease,
        background 180ms ease;
    }
    .theme-slider input[type="range"]::-moz-range-thumb {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fff, #ddd);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition:
        transform 180ms ease,
        background 180ms ease;
    }

    /* make the track itself respond smoothly when programmatically changed */
    .theme-slider input[type="range"]::-webkit-slider-runnable-track {
      transition:
        background-position 220ms ease,
        background-color 220ms ease;
    }
    .theme-slider input[type="range"]::-moz-range-track {
      transition:
        background-position 220ms ease,
        background-color 220ms ease;
    }

    .theme-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 11px;
      color: var(--text);
      opacity: 0.9;
    }
    .theme-labels span {
      user-select: none;
    }

    /* glow for boxes */
    .hero,
    .start-btn,
    .theme-slider input[type="range"] {
      box-shadow: 0 8px 30px var(--glow);
    }

    /* white theme overrides (inverted) with stronger blackish glow */
    .theme-white {
      --bg: rgb(230, 230, 230);
      --text: rgb(18, 18, 18);
      --glow: rgba(0, 0, 0, 0.2);
      --btn-bg: rgba(255, 255, 255, 0.95);
      --btn-text: var(--text);
    }

    /* dark theme override (explicit) */
    .theme-dark {
      --bg: rgb(25, 25, 25);
      --text: rgb(237, 237, 237);
      --glow: rgba(250, 250, 250, 0.08);
      --btn-bg: rgba(34, 34, 34, 0.9);
      --btn-text: var(--text);
    }

    /* ensure smooth dissolve-like transition for elements that change on theme switch */
    .title,
    .tagline,
    .hero,
    .start-btn,
    .theme-slider input[type="range"] {
      transition:
        background-color var(--fade-duration) ease,
        color var(--fade-duration) ease,
        box-shadow var(--fade-duration) ease,
        transform 160ms ease;
    }

    /* responsive */
    @media (max-width: 520px) {
      .title {
        font-size: 28px;
      }
      .tagline {
        font-size: 13px;
      }
      .start-btn {
        font-size: 16px;
        padding: 12px 18px;
      }
      .theme-slider {
        width: 150px;
      }
    }
  </style>

  <body>
    <main class="container">
      <header class="hero">
        <h1 class="title">WELCOME TO BRAINBUZZ</h1>
        <p class="tagline">
          SHARPEN YOUR MIND, TEST YOUR KNOWLEDGE, AND SEE HOW FAST YOU CAN
          THINK!
        </p>
        <a
          id="startBtn"
          class="start-btn"
          href="Main/SelectGrade.html"
          role="button"
          aria-label="Let's Get Started"
          tabindex="0"
        >
          <span class="btn-text">Let’s Get Started</span>
          <span class="btn-arrow">➜</span>
        </a>
      </header>
    </main>

    <div class="theme-slider" title="Theme">
      <input
        id="themeSelect"
        type="range"
        min="0"
        max="2"
        value="0"
        aria-label="Theme slider"
      />
      <div class="theme-labels" aria-hidden="true">
        <span data-val="0">System</span>
        <span data-val="1">Dark</span>
        <span data-val="2">White</span>
      </div>
    </div>

    <script>
      const startBtn = document.getElementById("startBtn");
      const themeRange = document.getElementById("themeSelect");
      const body = document.body;

      /* helper: apply theme with smooth dissolve transition */
      function applyThemeMode(mode) {
        // add a short fade class to avoid abrupt flash
        body.classList.add("theme-fading");
        // remove previous explicit theme classes
        body.classList.remove("theme-dark", "theme-white");

        if (mode === "system") {
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          if (prefersDark) {
            body.classList.add("theme-dark");
          } else {
            body.classList.add("theme-white");
          }
        } else if (mode === "dark") {
          body.classList.add("theme-dark");
        } else if (mode === "white") {
          body.classList.add("theme-white");
        }

        // keep the fade class for the duration of CSS fade, then remove
        setTimeout(() => body.classList.remove("theme-fading"), 2040);
      }

      /* map slider values: 0=system,1=dark,2=white */
      function sliderToMode(val) {
        if (val === "0") return "system";
        if (val === "1") return "dark";
        return "white";
      }

      /* initialize default = system */
      let saved = localStorage.getItem("brainbuzz-theme") || "system";
      const initialVal =
        saved === "system" ? "0" : saved === "dark" ? "1" : "2";
      themeRange.value = initialVal;
      applyThemeMode(saved);

      /* listen for system changes when in system mode */
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      if (mq.addEventListener) {
        mq.addEventListener("change", () => {
          if (
            localStorage.getItem("brainbuzz-theme") === "system" ||
            !localStorage.getItem("brainbuzz-theme")
          ) {
            applyThemeMode("system");
          }
        });
      } else if (mq.addListener) {
        mq.addListener(() => {
          if (
            localStorage.getItem("brainbuzz-theme") === "system" ||
            !localStorage.getItem("brainbuzz-theme")
          ) {
            applyThemeMode("system");
          }
        });
      }

      /* slider interaction */
      themeRange.addEventListener("input", (e) => {
        const mode = sliderToMode(e.target.value);
        localStorage.setItem("brainbuzz-theme", mode);
        applyThemeMode(mode);
      });

      /* BUTTON INTERACTIONS
   Use classes instead of inline styles so hover works reliably every time.
   Hover: scale 1.10 (CSS :hover)
   Click/pressed: add .pressed (scale 1.25) then navigate after short delay
*/
      function pressAndNavigate(e) {
        e.preventDefault();
        // ensure any existing pressed state is cleared first
        startBtn.classList.remove("pressed");
        // force reflow so the class re-application always triggers transition
        // eslint-disable-next-line no-unused-expressions
        startBtn.offsetWidth;
        startBtn.classList.add("pressed");

        // short delay to show pressed state, then remove and navigate
        setTimeout(() => {
          startBtn.classList.remove("pressed");
          window.location.href = startBtn.getAttribute("href");
        }, 180);
      }

      /* click */
      startBtn.addEventListener("click", pressAndNavigate);

      /* ensure hover/leave returns to normal */
      startBtn.addEventListener("mouseleave", () => {
        startBtn.classList.remove("pressed");
      });

      /* keyboard activation */
      startBtn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          pressAndNavigate(e);
        }
      });
    </script>
  </body>
</html>
