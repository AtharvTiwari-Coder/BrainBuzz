<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrainBuzz - Grade 9 Select Your Subject</title>
    <link rel="icon" type="image/png" href="../../BrainBuzzLogo.png" />
  </head>
  <style>
     :root {
      --bg: rgb(25, 25, 25);
      --text: rgb(237, 237, 237);
      --glow: rgba(250, 250, 250, 0.08);
      --btn-bg: rgba(34, 34, 34, 0.9);
      --btn-text: var(--text);
      --transition: 220ms cubic-bezier(0.2, 0.9, 0.2, 1);
      --fade-duration: 2000ms;
    }
    @font-face {
      font-family: "StencilCustom";
      src: url("../Fonts/StencilFont.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "RoundedCustom";
      src: url("../Fonts/ArialRoundedMTBoldRegularFont.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition: background-color var(--fade-duration) ease, color var(--fade-duration) ease;
      padding-top: env(safe-area-inset-top, 12px);
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }
    .container {
      width: 100%;
      max-width: 1100px;
      padding: 48px 24px;
      text-align: center;
    }
    .hero {
      padding: 36px;
      border-radius: 14px;
      box-shadow: 0 8px 30px var(--glow);
      backdrop-filter: blur(6px);
      transition: background-color var(--fade-duration) ease, box-shadow var(--fade-duration) ease, color var(--fade-duration) ease, transform 160ms ease;
      position: relative;
      z-index: 5;
      background-color: rgba(0,0,0,0.18);
      min-width: 260px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    .title {
      margin: 0 0 8px 0;
      font-size: 36px;
      letter-spacing: 1.5px;
      color: var(--text) !important;
      font-family: "StencilCustom", system-ui, sans-serif;
      text-transform: uppercase;
      transition: color var(--fade-duration) ease;
      position: relative;
      z-index: 6;
      line-height: 1.02;
    }
    .tagline {
      margin: 0 0 22px 0;
      font-size: 14px;
      color: var(--text);
      opacity: 0.95;
      max-width: 820px;
      margin-left: auto;
      margin-right: auto;
      transition: color var(--fade-duration) ease, opacity var(--fade-duration) ease;
      line-height: 1.25;
    }

    /* subjects grid */
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 18px;
    }
    @media (max-width: 920px) {
      .subjects-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px) {
      .subjects-grid { grid-template-columns: 1fr; gap: 12px; }
    }

    /* subject buttons (same styling as grade buttons) */
    .subject-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 14px;
      background: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      font-family: "RoundedCustom", "Segoe UI", Arial, sans-serif;
      box-shadow: 0 6px 20px var(--glow);
      transform: scale(1);
      transition: transform 180ms cubic-bezier(0.2, 0.9, 0.2, 1), box-shadow var(--fade-duration) ease, background-color var(--fade-duration) ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      min-height: 64px;
    }
    .subject-btn:hover { transform: scale(1.06); box-shadow: 0 12px 36px rgba(250,250,250,0.12); }
    .subject-btn:active { transform: scale(1.12); }
    .subject-btn.pressed { transform: scale(1.12); transition: transform 120ms ease-in-out; }
    .subject-btn:focus { box-shadow: 0 10px 36px rgba(0,0,0,0.12); outline: 3px solid rgba(0,0,0,0.06); }

    /* Theme slider */
    .theme-slider {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 170px;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
      z-index: 2147483647;
    }
    .theme-slider input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      width: 100%;
      height: 36px;
      background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border-radius: 20px;
      padding: 6px;
      outline: none;
      box-shadow: 0 6px 20px var(--glow);
      transition: box-shadow var(--fade-duration) ease, background-color var(--fade-duration) ease;
      -webkit-tap-highlight-color: transparent;
    }
    .theme-slider input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(180deg,#fff,#ddd);
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }
    .theme-slider input[type="range"]::-moz-range-thumb {
      appearance: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(180deg,#fff,#ddd);
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }
    .theme-slider input[type="range"]::-webkit-slider-runnable-track {
      transition: background-position 220ms ease, background-color 220ms ease;
    }
    .theme-slider input[type="range"]::-moz-range-track {
      transition: background-position 220ms ease, background-color 220ms ease;
    }
    .theme-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 11px;
      color: var(--text);
      opacity: 0.95;
      pointer-events: none;
    }
    .theme-labels span { user-select: none; }

    .hero, .subject-btn, .theme-slider input[type="range"] { box-shadow: 0 8px 30px var(--glow); }

    .theme-white {
      --bg: rgb(230,230,230);
      --text: rgb(18,18,18);
      --glow: rgba(0,0,0,0.2);
      --btn-bg: rgba(255,255,255,0.95);
      --btn-text: var(--text);
    }
    .theme-white .hero { background-color: rgba(255,255,255,0.92); color: var(--text); }

    .theme-dark {
      --bg: rgb(25,25,25);
      --text: rgb(237,237,237);
      --glow: rgba(250,250,250,0.08);
      --btn-bg: rgba(34,34,34,0.9);
      --btn-text: var(--text);
    }
    .theme-dark .hero { background-color: rgba(0,0,0,0.22); color: var(--text); }

    .title, .tagline, .hero, .subject-btn, .theme-slider input[type="range"] {
      transition: background-color var(--fade-duration) ease, color var(--fade-duration) ease, box-shadow var(--fade-duration) ease, transform 160ms ease;
    }

    @media (max-width: 520px) {
      .title { font-size: 28px; }
      .tagline { font-size: 13px; }
      .subject-btn { font-size: 16px; padding: 14px 12px; min-height: 56px; }
      .theme-slider { width: 150px; }
    }
    @media (max-width: 360px) {
      .theme-slider { right: 8px; bottom: 8px; width: 140px; }
      .theme-slider input[type="range"] { height: 32px; }
      .theme-labels { font-size: 10px; }
    }
  </style>
  <body>
    <main class="container">
      <header class="hero">
        <h1 class="title">Grade 9 - Select Your Subject</h1>
        <p class="tagline">Choose a subject to continue.</p>

        <div class="subjects-grid" role="list" aria-label="Subject selection">
          <a
            class="subject-btn"
            href="Grade9EnglishSelectTopic.html"
            role="listitem"
            tabindex="0"
            >English</a
          >
          <a
            class="subject-btn"
            href="Grade9SScSelectTopic.html"
            role="listitem"
            tabindex="0"
            >Social Science</a
          >
          <a
            class="subject-btn"
            href="Grade9ScienceSelectTopic.html"
            role="listitem"
            tabindex="0"
            >Science</a
          >
          <a
            class="subject-btn"
            href="Grade9VESelectTopic.html"
            role="listitem"
            tabindex="0"
            >Vocational Education</a
          >
          <a
            class="subject-btn"
            href="Grade9DLSelectTopic.html"
            role="listitem"
            tabindex="0"
            >Digital Learning</a
          >
          <a
            class="subject-btn"
            href="Grade9MatheMaticsSelectTopic.html"
            role="listitem"
            tabindex="0"
            >Mathematics</a
          >
        </div>
      </header>
    </main>

    <div class="theme-slider" title="Theme">
      <input
        id="themeSelect"
        type="range"
        min="0"
        max="2"
        value="0"
        aria-label="Theme slider"
      />
      <div class="theme-labels" aria-hidden="true">
        <span data-val="0">System</span>
        <span data-val="1">Dark</span>
        <span data-val="2">White</span>
      </div>
    </div>

    <script src="Grade9SelectSubject.js"></script>
  </body>
  <script>
    const themeRange = document.getElementById("themeSelect");
    const body = document.body;

    /* helper: apply theme with smooth dissolve transition */
    function applyThemeMode(mode){
      body.classList.add('theme-fading');
      body.classList.remove('theme-dark','theme-white');

      if(mode === 'system'){
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if(prefersDark){
          body.classList.add('theme-dark');
        } else {
          body.classList.add('theme-white');
        }
      } else if(mode === 'dark'){
        body.classList.add('theme-dark');
      } else if(mode === 'white'){
        body.classList.add('theme-white');
      }

      setTimeout(() => body.classList.remove('theme-fading'), 2040);
    }

    /* map slider values: 0=system,1=dark,2=white */
    function sliderToMode(val){
      if(val === '0') return 'system';
      if(val === '1') return 'dark';
      return 'white';
    }

    /* initialize default = system */
    let saved = localStorage.getItem('brainbuzz-theme') || 'system';
    const initialVal = saved === 'system' ? '0' : (saved === 'dark' ? '1' : '2');
    themeRange.value = initialVal;
    applyThemeMode(saved);

    /* listen for system changes when in system mode */
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) {
      mq.addEventListener('change', () => {
        if(localStorage.getItem('brainbuzz-theme') === 'system' || !localStorage.getItem('brainbuzz-theme')){
          applyThemeMode('system');
        }
      });
    } else if (mq.addListener) {
      mq.addListener(() => {
        if(localStorage.getItem('brainbuzz-theme') === 'system' || !localStorage.getItem('brainbuzz-theme')){
          applyThemeMode('system');
        }
      });
    }

    /* slider interaction */
    themeRange.addEventListener('input', (e) => {
      const mode = sliderToMode(e.target.value);
      localStorage.setItem('brainbuzz-theme', mode);
      applyThemeMode(mode);
    });

    /* subject button interactions */
    const subjectButtons = document.querySelectorAll(".subject-btn");
    function pressAndNavigateSubject(e){
      e.preventDefault();
      const el = e.currentTarget;
      el.classList.remove('pressed');
      el.offsetWidth;
      el.classList.add('pressed');
      setTimeout(() => {
        el.classList.remove('pressed');
        const href = el.getAttribute('href');
        if(href) window.location.href = href;
      }, 160);
    }
    subjectButtons.forEach(btn => {
      btn.addEventListener('click', pressAndNavigateSubject);
      btn.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          pressAndNavigateSubject(e);
        }
      });
      btn.addEventListener('mouseleave', () => btn.classList.remove('pressed'));
    });
  </script>
</html>
