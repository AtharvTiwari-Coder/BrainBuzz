<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrainBuzz - Select Your Grade</title>
    <link rel="stylesheet" href="SelectGrade.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1 class="title">Select Your Grade/Class</h1>
        <p class="tagline">
          Choose a grade to continue — pick the level you want to practice.
        </p>

        <div class="grades-grid" role="list" aria-label="Grade selection">
          <a
            class="grade-btn"
            href="Grade1/Grade1SelectSubject.html"
            role="listitem"
            tabindex="0"
            >Grade 1</a
          >
          <a
            class="grade-btn"
            href="Grade2/Grade2SelectSubject.html"
            role="listitem"
            tabindex="0"
            >Grade 2</a
          >
          <a
            class="grade-btn"
            href="Grade3/Grade3SelectSubject.html"
            role="listitem"
            tabindex="0"
            >Grade 3</a
          >
          <a
            class="grade-btn"
            href="Grade4/Grade4SelectSubject.html"
            role="listitem"
            tabindex="0"
            >Grade 4</a
          >
          <a
            class="grade-btn"
            href="Grade5/Grade5SelectSubject.html"
            role="listitem"
            tabindex="0"
            >Grade 5</a
          >
          <a
            class="grade-btn"
            href="Grade6/Grade6SelectSubject.html"
            role="listitem"
            tabindex="0"
            >Grade 6</a
          >
          <a
            class="grade-btn"
            href="Grade7/Grade7SelectSubject.html"
            role="listitem"
            tabindex="0"
            >Grade 7</a
          >
          <a
            class="grade-btn"
            href="Grade8/Grade8SelectSubject.html"
            role="listitem"
            tabindex="0"
            >Grade 8</a
          >
          <a
            class="grade-btn"
            href="Grade9/Grade9SelectSubject.html"
            role="listitem"
            tabindex="0"
            >Grade 9</a
          >
          <a
            class="grade-btn"
            href="Grade10/Grade10SelectSubject.html"
            role="listitem"
            tabindex="0"
            >Grade 10</a
          >
          <a
            class="grade-btn"
            href="Grade11/Grade11SelectSubject.html"
            role="listitem"
            tabindex="0"
            >Grade 11</a
          >
          <a
            class="grade-btn"
            href="Grade12/Grade12SelectSubject.html"
            role="listitem"
            tabindex="0"
            >Grade 12</a
          >
        </div>
      </header>
    </main>

    <div class="theme-slider" title="Theme">
      <input
        id="themeSelect"
        type="range"
        min="0"
        max="2"
        value="0"
        aria-label="Theme slider"
      />
      <div class="theme-labels" aria-hidden="true">
        <span data-val="0">System</span>
        <span data-val="1">Dark</span>
        <span data-val="2">White</span>
      </div>
    </div>

    <script src="SelectGrade.js"></script>
  </body>
</html>
